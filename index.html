${v.pn.hasStatus ? html`<div style="font-size: 19px; color: ${v.pn.statusCol}; flex: none">${v.pn.status}</div>` : null}

${v.vp.open ? html`

<div style="font-size: 19px; line-height: 1.45; color: #A6A59E; flex: none">Голоса берутся из этого устройства. Сверху — самые естественные. Выбор запоминается на этом устройстве отдельно для русского и английского текста.</div>

<button type="button" aria-label="Прослушать ${vo.name}" onClick=${vo.play} style="height: 60px; padding: 0 22px; border-radius: 999px; font-size: 20px; font-weight: 500; cursor: pointer; white-space: nowrap; touch-action: manipulation; background: transparent; color: #F3F2EE; border: 1.5px solid rgba(255,255,255,0.22); display: flex; align-items: center; gap: 8px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16l13 -8l-13 -8" /></svg><span>Прослушать</span></button>

</div>
` : null}
</div></div>${v.reader ? html`<div class="rd-back" onClick=${v.closeReader}><div class="rd" onClick=${e => e.stopPropagation()}><div class="rd-bar"><span class="rd-src">${v.readerSrc}</span><a class="rd-btn" href=${v.reader} target="_blank" rel="noopener">Открыть в браузере ↗</a><button class="rd-btn rd-x" type="button" aria-label="Закрыть" onClick=${v.closeReader}>✕</button></div>${v.rFrame ? html`<iframe src=${v.reader} title="Статья" referrerpolicy="no-referrer-when-downgrade"></iframe>` : html`<div class="rd-scroll">${v.rLoad ? html`<div class="rd-msg"><span class="rd-spin"></span>Готовлю режим чтения…</div>` : null}${v.rErr ? html`<div class="rd-msg">${v.rErr}.<br/><a class="rd-btn" href=${v.reader} target="_blank" rel="noopener">Открыть оригинал ↗</a></div>` : null}${v.rd ? html`<article class="rd-art"><div class="rd-meta">${v.rd.site}${v.rd.dt ? ' · ' + v.rd.dt : ''}${v.rd.min ? ' · ' + v.rd.min : ''}</div><h1>${v.rd.title}</h1>${v.rd.orig ? html`<div class="rd-orig">${v.rd.orig}</div>` : null}${v.rd.byline ? html`<div class="rd-by">${v.rd.byline}</div>` : null}${v.rd.hero ? html`<img class="rd-hero" src=${v.rd.hero} alt="" referrerpolicy="no-referrer"/>` : null}<div class="rd-body" dangerouslySetInnerHTML=${v.rHtml}></div><div class="rd-end">Текст получен из источника в режиме чтения и не хранится. Оригинал: <a href=${v.rd.url} target="_blank" rel="noopener">${v.rd.site} ↗</a></div></article>` : null}</div>`}</div></div>` : null}`;
}
function fit() { const vw = window.innerWidth, vh = window.innerHeight, s = Math.min(vw, vh) / 1360, w = vw / s, h = vh / s, ENL = 1.12;
  for (const [sel, k] of [['.wrap', ENL], ['.ringl', 1]]) { const st = document.querySelector(sel); if (!st) continue; st.style.width = w + 'px'; st.style.height = h + 'px'; st.style.margin = (-h / 2) + 'px 0 0 ' + (-w / 2) + 'px'; st.style.transform = 'scale(' + (s * k) + ')'; } }
window.addEventListener('resize', fit); fit();
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
document.addEventListener('error', e => { const t = e.target; if (t && t.tagName === 'IMG' && t.closest && t.closest('.rd-body, .rd-art')) { const f = t.closest('figure'); (f || t).style.display = 'none'; } }, true);
document.addEventListener('keydown', e => { const d = window.__dome; if (!d || e.key !== 'Escape') return; if (d.state.reader) d.setState({ reader: '' }); else if (d.state.panel) d.setState({ panel: false }); else if (d.state.vpanel) { d.stopSpeak(); d.setState({ vpanel: false }); } else if (d.state.act) d.closeCard(); });
let lastTouchEnd = 0; document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouchEnd < 320 && !(e.target.closest && e.target.closest('button, a, input, .rd-back, .pnl'))) e.preventDefault(); lastTouchEnd = now; }, { passive: false });
document.addEventListener('touchmove', e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
render(html`<${Component} />`, document.getElementById('app')); fit();
const fsb = document.getElementById('fs');
const canFs = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
if (!canFs || (window.navigator.standalone)) fsb.classList.add('hide');
fsb.addEventListener('click', () => {
  try {
    const d = document;
    if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
    const el = d.documentElement, p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
});
document.addEventListener('fullscreenchange', () => { fsb.style.opacity = document.fullscreenElement ? '0.2' : ''; });
try { if ('serviceWorker' in navigator && window.self === window.top) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
</script>
